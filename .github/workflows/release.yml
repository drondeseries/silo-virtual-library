name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.0"
  PYTHON: "python3"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Validate release metadata and strict SemVer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -er '.version' manifest.json)"
          CATALOG_VERSION="$(jq -er '.plugins[0].manifest.version' catalog.json)"
          TOOL_SCRIPT="$(pwd)/scripts/release_tool.py"

          # Strict SemVer 2.0 validation (leading zeros / malformed identifiers rejected)
          python3 "$TOOL_SCRIPT" validate-semver "$VERSION"
          python3 "$TOOL_SCRIPT" validate-semver "$MANIFEST_VERSION"
          python3 "$TOOL_SCRIPT" validate-semver "$CATALOG_VERSION"

          # manifest.json declares the NEW version (embedded in the binary)
          test "$VERSION" = "$MANIFEST_VERSION"

          # The committed catalog.json describes the LAST VERIFIED release (real, published
          # hashes) — it must be a strictly older valid release than the one being cut.
          # This keeps the tag's catalog provenance truthful: immutable tags cannot be
          # rewritten with freshly-produced hashes after CI runs.
          RELATION="$(python3 "$TOOL_SCRIPT" compare-semver "$CATALOG_VERSION" "$VERSION")"
          test "$RELATION" = "LESS"

          jq -e '.capabilities[] | select(.type == "virtual_stream_provider.v1") | .virtual_stream_provider.supported_media_types | length > 0' manifest.json >/dev/null
          jq -e '.plugins[0].manifest.capabilities[] | select(.type == "virtual_stream_provider.v1") | .virtual_stream_provider.supported_media_types | length > 0' catalog.json >/dev/null
      - name: Run tests
        run: |
          go test ./...
          python3 -m unittest scripts/test_release_tool.py -v

  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Build plugin binary (reproducible, pinned toolchain)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOWORK: off
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags="-s -w" -o "dist/plugin-${GOOS}-${GOARCH}" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/plugin-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Prepare assets, checksums, and provenance
        run: |
          mkdir release
          find artifacts -type f -name 'plugin-*' -exec cp {} release/ \;
          cd release
          sha256sum plugin-* > checksums.txt
          cd ..
          python3 scripts/release_tool.py generate-provenance release "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ env.GO_VERSION }}"
      - name: Show provenance
        run: |
          cat release/provenance.json
      - name: Publish GitHub release (idempotent / immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists on GitHub. Verifying exact asset set and hashes for idempotent resume..."
            CHECK_DIR="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$CHECK_DIR"
            python3 "$TOOL_SCRIPT" verify-existing-assets "$CHECK_DIR" "$RELEASE_DIR"
            rm -rf "$CHECK_DIR"
            echo "Existing release matches built artifacts exactly. Proceeding to ensure catalog.json is current."
          else
            echo "Creating new immutable release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              release/plugin-linux-amd64 \
              release/plugin-linux-arm64 \
              release/plugin-darwin-arm64 \
              release/checksums.txt \
              release/provenance.json
          fi
      - name: Update catalog.json on main (strict SemVer with retry exhaustion guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"

          LINUX_AMD64_HASH=$(sha256sum release/plugin-linux-amd64 | awk '{print $1}')
          LINUX_ARM64_HASH=$(sha256sum release/plugin-linux-arm64 | awk '{print $1}')
          DARWIN_ARM64_HASH=$(sha256sum release/plugin-darwin-arm64 | awk '{print $1}')

          # Absolute path to the tagged checkout tools - robust regardless of cwd
          TOOL_SCRIPT="$(pwd)/scripts/release_tool.py"
          RELEASE_DIR="$(pwd)/release"

          MAIN_WORKTREE="$(mktemp -d)"
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$MAIN_WORKTREE"
          cd "$MAIN_WORKTREE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PUSH_COMPLETED=false

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            CURRENT_CATALOG_VERSION="$(jq -er '.plugins[0].manifest.version' catalog.json)"

            # Compare with strict SemVer 2.0 tooling from the tagged checkout.
            # compare(current, target):
            #   "GREATER" = current catalog version is strictly newer than target release
            #              => this release is stale, do NOT downgrade the catalog
            #   "EQUAL"/"LESS" = target is >= current => proceed (idempotently)
            SEMVER_RELATION=$(python3 "$TOOL_SCRIPT" compare-semver "$CURRENT_CATALOG_VERSION" "$VERSION")

            if [ "$SEMVER_RELATION" = "GREATER" ]; then
              echo "Warning: main catalog version ($CURRENT_CATALOG_VERSION) is strictly newer than release version ($VERSION). Skipping catalog update."
              PUSH_COMPLETED=true
              break
            fi

            python3 "$TOOL_SCRIPT" update-catalog catalog.json "$TAG" \
              "$LINUX_AMD64_HASH" "$LINUX_ARM64_HASH" "$DARWIN_ARM64_HASH"

            git add catalog.json
            if git diff --staged --quiet; then
              echo "catalog.json is already up-to-date with release ${TAG}."
              PUSH_COMPLETED=true
              break
            fi

            git commit -m "chore(catalog): auto-update catalog.json for release ${TAG}"
            if git push origin main; then
              echo "Successfully updated catalog.json on main for ${TAG}."
              PUSH_COMPLETED=true
              break
            fi
            echo "Push race detected on main, retrying (attempt $attempt)..."
            sleep 2
          done

          rm -rf "$MAIN_WORKTREE"

          if [ "$PUSH_COMPLETED" != "true" ]; then
            echo "::error::Failed to update catalog.json on main after 5 attempts due to push conflicts."
            exit 1
          fi
